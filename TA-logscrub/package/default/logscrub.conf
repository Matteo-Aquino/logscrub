# logscrub.conf — Compliance standard definitions
#
# Each stanza names a compliance standard and lists the pattern names it enables.
# Admins can override these in local/logscrub.conf without touching this file.
#
# Pattern names:
#   PII         : email, phone, ssn, us_passport
#   Credentials : jwt, bearer_token, openai_key, github_token, aws_access_key,
#                 generic_credential, slack_token, stripe_key, google_api_key,
#                 anthropic_key, sendgrid_key
#   Financial   : credit_card, iban
#   Network     : url_credentials, ipv4, mac_address

[gdpr]
description = EU General Data Protection Regulation
patterns    = email,phone,ssn,us_passport,ipv4,mac_address,credit_card,iban,url_credentials,generic_credential

[hipaa]
description = US Health Insurance Portability and Accountability Act
patterns    = email,phone,ssn,us_passport,credit_card,ipv4,url_credentials,generic_credential

[pci]
description = Payment Card Industry Data Security Standard
patterns    = credit_card,iban,url_credentials,generic_credential

[soc2]
description = Service Organization Control 2 — secrets and credential exposure
patterns    = jwt,bearer_token,openai_key,github_token,aws_access_key,generic_credential,slack_token,stripe_key,google_api_key,anthropic_key,sendgrid_key,url_credentials

[all]
description = All available patterns
patterns    = *

[none]
description = No built-in patterns — use with configuration= for fully custom sets
patterns    =
