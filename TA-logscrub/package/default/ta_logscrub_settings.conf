# ta_logscrub_settings.conf — Default settings for the LogScrub Configuration page.
# This file is managed by UCC. Admins set values in Splunk Web > Apps > LogScrub > Configuration.
# Overrides go in local/ta_logscrub_settings.conf.

[settings]
default_standard       = gdpr
default_mask_style     = partial
default_min_confidence = 0
default_report_findings = true
default_allowlist      =

[logging]
loglevel = INFO
