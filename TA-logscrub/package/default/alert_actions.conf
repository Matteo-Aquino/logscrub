[logscrub_sanitize]
is_custom       = 1
label           = LogScrub: Sanitize & Collect
description     = Scrub PII and secrets from alert results, then write scrubbed events to a summary index.
icon_path       = appIcon.png
payload_format  = json
python.version  = python3
python.required = 3.13

param.fields          = _raw
param.standard        = gdpr
param.mask_style      = partial
param.summary_index   = logscrub_findings
param.report_findings = 1
