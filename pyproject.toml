[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "datascrub"
version = "2.0.0"
description = "Pre-scrub sensitive data before feeding text/JSON/CSV to AI"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.0",
    "platformdirs>=4.0",
]

[project.scripts]
datascrub = "datascrub.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datascrub*"]
